services:
  backend:
    build: ./backend
    container_name: devflow-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./devflow.db
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # 命名卷隔离宿主 .venv / __pycache__，避免 bind mount 覆盖容器内环境
      - backend-venv:/app/.venv
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: devflow-web
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # 命名卷替代匿名卷：Windows 下匿名卷 "/app/node_modules" 会被解析为主机路径导致启动失败
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-venv:
  frontend-node-modules:
